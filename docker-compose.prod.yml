# Production Docker Compose — pulls the pre-built Bifrost image from GHCR.
#
# Quick start (bundled Valkey + semantic cache):
#   docker compose -f docker-compose.prod.yml up -d
#
# China mirror acceleration (Valkey pull):
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod.cn.yml up -d
#   See docker-daemon.mirror.example.json for Docker Engine registry-mirrors.
#
# Subpath deployment (UI + dashboard API under /zai):
#   BIFROST_BASE_PATH=/zai docker compose -f docker-compose.prod.yml up -d
#   Note: BIFROST_BASE_PATH must match how the image was built (Vite base + router).
#   Rebuild with: docker build -f transports/Dockerfile.local --build-arg BIFROST_BASE_PATH=/zai ...
#   Aone OAuth callback: https://<host>/zai/api/aone/oauth/callback
#
# Copy .env.example to .env and adjust as needed:
#   cp .env.example .env
#
# External Valkey/Redis instead of the bundled service:
#   Set BIFROST_REDIS_ADDR (and credentials) in .env, then either:
#     - docker compose -f docker-compose.prod.yml up -d --scale valkey=0
#     - or use docker-compose.prod.override.yml to omit the valkey service
#
# Notes:
# - /health and /v1/* remain available at the container root for probes and LLM clients.
# - config.json is baked into the image at /app/defaults/config.json and copied to
#   /app/data/config.json on first start (APP_DIR is a volume, so defaults live outside it).
#   Mount your own config to override: -v ./config.json:/app/data/config.json:ro
# - BIFROST_ENV=production enables baked-in production defaults:
#     * Redis/Valkey vector store (type "redis" — use for Valkey endpoints too)
#     * semantic_cache plugin (direct-hash mode, dimension=1; recommended with Valkey)
# - Redis/Valkey + semantic cache settings are read at deploy time from environment
#   variables (see .env.example).
# - Override image: BIFROST_IMAGE=ghcr.io/orionlize/bifrost:prod

services:
  valkey:
    image: ${VALKEY_IMAGE:-valkey/valkey-bundle:9.0.0}
    command: valkey-server --protected-mode no
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - bifrost-prod

  bifrost:
    image: ${BIFROST_IMAGE:-ghcr.io/orionlize/bifrost:prod}
    depends_on:
      valkey:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - bifrost-data:/app/data
    environment:
      APP_PORT: "8080"
      APP_HOST: 0.0.0.0
      LOG_LEVEL: info
      LOG_STYLE: json
      GOGC: "200"
      GOMEMLIMIT: 3600MiB
      BIFROST_BASE_PATH: ${BIFROST_BASE_PATH:-/zai}
      BIFROST_ENV: production
      BIFROST_REDIS_ADDR: ${BIFROST_REDIS_ADDR:-valkey:6379}
      BIFROST_REDIS_USERNAME: ${BIFROST_REDIS_USERNAME:-}
      BIFROST_REDIS_PASSWORD: ${BIFROST_REDIS_PASSWORD:-}
      BIFROST_SEMANTIC_CACHE_ENABLED: ${BIFROST_SEMANTIC_CACHE_ENABLED:-true}
      BIFROST_SEMANTIC_CACHE_TTL: ${BIFROST_SEMANTIC_CACHE_TTL:-300}
      BIFROST_SEMANTIC_CACHE_THRESHOLD: ${BIFROST_SEMANTIC_CACHE_THRESHOLD:-0.8}
      BIFROST_SEMANTIC_CACHE_NAMESPACE: ${BIFROST_SEMANTIC_CACHE_NAMESPACE:-bifrost_semantic_cache}
      BIFROST_SEMANTIC_CACHE_DEFAULT_KEY: ${BIFROST_SEMANTIC_CACHE_DEFAULT_KEY:-bifrost-default}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "2"
          memory: 2G
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - bifrost-prod

networks:
  bifrost-prod:

volumes:
  bifrost-data:
  valkey-data:
